name: Build STS Debug APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 代码已经直接在仓库里，不需要再 git apply 补丁。
      # build-deps（desktop.jar / jre8-pojav.zip）由 :app 的 ensureBuildDependencies 自动下载。
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Resolve version
        id: version
        run: |
          value=$(grep -E '^application.version.name=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk \
            "dist/SlayTheAmethyst-${{ steps.version.outputs.value }}-debug.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STS-Debug-APK
          path: dist/*.apk
          if-no-files-found: error

      # 发布成 Release，浏览器即使用户登录状态丢失也能直接下载。
      - name: Publish debug APK to Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Slay the Amethyst v${{ steps.version.outputs.value }} (debug)
          body: |
            由 GitHub Actions 自动构建的 debug APK，随 `main` 分支更新。

            - 版本：${{ steps.version.outputs.value }}
            - 提交：${{ github.sha }}
            - 构建流水线：[Build STS Debug APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: dist/*.apk
          overwrite: true
          make_latest: true

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
